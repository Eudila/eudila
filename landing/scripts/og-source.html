<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Figtree;
        src: url("../assets/Figtree.ttf") format("truetype");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        gap: 72px;
        padding: 76px 88px;
        background: #fbfbfd;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        position: absolute;
        top: -190px;
        right: -180px;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(95 211 208 / 0.28), rgb(95 211 208 / 0));
        content: "";
      }

      .copy {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 58px;
        font-family: Figtree, sans-serif;
        font-size: 57px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .brand img {
        width: 58px;
        height: 58px;
      }

      h1 {
        max-width: 710px;
        margin: 0 0 24px;
        font-family: Figtree, sans-serif;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 0.96;
      }

      p {
        max-width: 700px;
        margin: 0;
        color: #505056;
        font-size: 29px;
        line-height: 1.35;
      }

      .symbol {
        position: relative;
        z-index: 1;
        display: grid;
        width: 330px;
        height: 330px;
        place-items: center;
        border-radius: 50%;
        background: #0f5654;
        box-shadow: 0 34px 90px rgb(12 138 134 / 0.24);
      }

      .symbol img {
        width: 250px;
        height: 250px;
      }

      .tag {
        position: absolute;
        right: 88px;
        bottom: 52px;
        color: #086e6b;
        font-size: 22px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../assets/logo.svg" alt="" /> <span>eudila</span></div>
      <h1>Un espejo tranquilo para cada estado de ánimo.</h1>
      <p>Registro emocional abierto, portable y diseñado con privacidad verificable.</p>
    </div>
    <div class="symbol"><img src="../assets/logo.svg" alt="" /></div>
    <div class="tag">Código abierto · Datos portables</div>
  </body>
</html>

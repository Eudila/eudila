<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Figtree;
        src: url("../assets/Figtree.ttf") format("truetype");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        gap: 72px;
        padding: 76px 88px;
        background:
          radial-gradient(
            140% 45% at 50% 0%,
            rgb(230 81 117 / 0.12),
            transparent 70%
          ),
          linear-gradient(180deg, #1a1626 0%, #171320 56%, #100d18 100%);
        color: #f4f1fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .copy {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 58px;
        font-family: Figtree, sans-serif;
        font-size: 57px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .brand img {
        width: 58px;
        height: 58px;
      }

      h1 {
        max-width: 710px;
        margin: 0 0 24px;
        font-family: Figtree, sans-serif;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 0.96;
      }

      p {
        max-width: 700px;
        margin: 0;
        color: #dad5ea;
        font-size: 29px;
        line-height: 1.35;
      }

      .symbol {
        position: relative;
        z-index: 1;
        display: grid;
        width: 330px;
        height: 330px;
        place-items: center;
        border: 1px solid rgb(214 208 230 / 0.3);
        border-radius: 44px;
        background: rgb(214 208 230 / 0.06);
        box-shadow: 0 34px 90px rgb(0 0 0 / 0.35);
      }

      .symbol img {
        width: 250px;
        height: 250px;
      }

      .tag {
        position: absolute;
        right: 88px;
        bottom: 52px;
        color: #f6c2cf;
        font-size: 22px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../assets/logo.svg" alt="" /> <span>eudila</span>
      </div>
      <h1>Lo que pasa entre sesiones, también llega a la consulta.</h1>
      <p>Registro emocional abierto para pacientes y psicólogos.</p>
    </div>
    <div class="symbol"><img src="../assets/logo.svg" alt="" /></div>
    <div class="tag">Ganadores · Hackathon Noainova 2026</div>
  </body>
</html>

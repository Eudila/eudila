# Landing de eudila. Proyecto propio y aislado: no comparte red, puertos ni nginx con otros servicios.
name: eudila-landing
services:
  web:
    build: .
    image: eudila-landing:latest
    container_name: eudila-landing
    restart: unless-stopped
    # Solo loopback, para comprobarlo por SSH. El tráfico público llega por el túnel.
    ports: ["127.0.0.1:8081:80"]
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs: [/var/cache/nginx, /run, /tmp]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: eudila-landing-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://web:80
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets: [tunnel_token]
    depends_on: [web]
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
secrets:
  tunnel_token:
    file: ./secrets/tunnel-token

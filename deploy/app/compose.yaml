# App eudila completa: Next.js + Supabase Auth (GoTrue) + PostgREST + Postgres, detrás de un túnel de Cloudflare.
# Proyecto propio: red y volúmenes aislados y ningún puerto publicado, así que convive con otros servicios.
name: eudila-app

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.004
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: "3600"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    logging: *logging

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_MIGRATIONS_PATH: /usr/local/etc/auth/migrations
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/auth/callback
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}/auth/v1
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Login con Google (credenciales en .env; el redirect es el callback de este mismo dominio).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/v1/callback
      # Email: apagado hasta tener SMTP (sin él no se pueden confirmar cuentas ni recuperar claves).
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${PUBLIC_URL}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${PUBLIC_URL}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${PUBLIC_URL}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: ${PUBLIC_URL}/auth/v1/verify
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirmá tu email en eudila
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Recuperá tu acceso a eudila
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway:8088/email/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway:8088/email/recovery.html
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-eudila}
    mem_limit: 256m
    logging: *logging

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.4
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${JWT_SECRET}
    mem_limit: 256m
    logging: *logging

  web:
    build: ./web-ctx
    image: eudila-app-web:latest
    restart: unless-stopped
    depends_on: [auth, rest]
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web, auth, rest]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./email:/usr/share/nginx/email:ro
    mem_limit: 128m
    logging: *logging

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://gateway:80
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets: [tunnel_token]
    depends_on: [gateway]
    mem_limit: 128m
    logging: *logging

secrets:
  tunnel_token:
    file: ./secrets/tunnel-token

volumes:
  db-data:

# Puerta de entrada de app.eudila.com: reparte por ruta y deja una sola URL para el navegador.
#   /auth/v1/*  -> Supabase Auth (GoTrue)        /rest/v1/*  -> PostgREST (catálogo y perfiles, con RLS)
#   todo lo demás -> la app Next.js
# El HTTPS lo termina Cloudflare; acá solo HTTP interno.
server_tokens off;

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80 default_server;
    server_name _;

    # Las cookies de sesión de Supabase son grandes (varios KB). Con los límites por defecto de nginx
    # (8 KB por cookie del pedido, 4 KB por encabezados de la respuesta) el callback del login da
    # 502 y después 400. Una cookie de sesión típica queda muy por debajo de estos topes.
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Los tres reciben siempre tráfico que ya pasó por Cloudflare con HTTPS.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /gateway-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        client_max_body_size 1m;
    }

    location / {
        proxy_pass http://web:3000;
    }
}

# Plantillas de correo de app/supabase/templates, solo para GoTrue (red interna, sin puerto publicado).
server {
    listen 8088;
    root /usr/share/nginx/email;
    location /email/ { alias /usr/share/nginx/email/; }
}

# Landing estática detrás de Cloudflare. Cloudflare termina el HTTPS; acá solo HTTP.
server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript image/svg+xml application/json text/plain;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # add_header no se hereda si el location define el suyo: se incluye en cada uno.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La página se revalida siempre; los archivos no llevan hash en el nombre.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.(?:js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # Video, capturas y fuente. nginx atiende Range, que el video necesita para empezar rápido.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        location ~* \.ttf$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            default_type font/ttf;
        }
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        # /privacidad -> privacidad.html, como cleanUrls en Vercel.
        try_files $uri $uri.html =404;
    }

    error_page 404 /index.html;
}

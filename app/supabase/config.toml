# Supabase local de esta app. No configura ni modifica proyectos Cloud.
project_id = "eudila-ladyfish"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback", "http://127.0.0.1:3119/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "2s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirmá tu email en eudila"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recuperá tu acceso a eudila"
content_path = "./supabase/templates/recovery.html"

# Habilitar solo después de completar credenciales OAuth en app/.env.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[analytics]
enabled = false

[edge_runtime]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false
